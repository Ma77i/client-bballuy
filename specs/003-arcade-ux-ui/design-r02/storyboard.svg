<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2100" viewBox="0 0 1600 2100"><rect width="1600" height="2100" fill="#0C1220"/><style>text{font-family:Arial,sans-serif} .title{font-weight:800;fill:#FFF7ED} .body{fill:#B8C3D6;font-size:20px} .ink{fill:#0C1220;font-size:22px;font-weight:700}</style><text x="64" y="70" fill="#FF8A43" font-size="22">BBALLUY ARCADE / SPEC-003 / T01 / R02</text><text class="title" x="64" y="126" font-size="42">STORYBOARD DE INTERACCIONES</text><text class="body" x="64" y="170">Fotogramas propuestos · No son animaciones implementadas · Español inicial</text><text x="64" y="240" fill="#FF8A43" font-size="25" font-weight="700">01</text><text class="title" x="120" y="240" font-size="27">Elegir cancha</text><text class="body" x="1000" y="240">100 ms + navegación existente</text><rect x="120" y="264" width="400" height="97" rx="16" fill="#FFF7ED"/><text x="138" y="291" font-size="16" fill="#243047">A · INICIO</text><text class="ink" x="138" y="326">Tarjeta en reposo</text><path d="M532 314h33m-10-8 10 8-10 8" fill="none" stroke="#B8C3D6" stroke-width="3"/><rect x="580" y="264" width="400" height="97" rx="16" fill="#FF8A43"/><text x="598" y="291" font-size="16" fill="#243047">B · RESPUESTA</text><text class="ink" x="598" y="326">Presión breve</text><path d="M992 314h33m-10-8 10 8-10 8" fill="none" stroke="#B8C3D6" stroke-width="3"/><rect x="1040" y="264" width="400" height="97" rx="16" fill="#FFF7ED"/><text x="1058" y="291" font-size="16" fill="#243047">C · ESTADO</text><text class="ink" x="1058" y="326">Abrir detalle</text><text class="body" x="120" y="398">Cancelar toque: volver al reposo. Sin cola ni espera.</text><text x="120" y="434" fill="#FFF7ED" font-size="20">Reducido: tinte estático y navegación inmediata.</text><path d="M64 453H1536" stroke="#53647E"/><text x="64" y="493" fill="#FF8A43" font-size="25" font-weight="700">02</text><text class="title" x="120" y="493" font-size="27">Lista ↔ Mapa</text><text class="body" x="1000" y="493">160 ms · opacidad</text><rect x="120" y="517" width="400" height="97" rx="16" fill="#FFF7ED"/><text x="138" y="544" font-size="16" fill="#243047">A · INICIO</text><text class="ink" x="138" y="579">Lista seleccionada</text><path d="M532 567h33m-10-8 10 8-10 8" fill="none" stroke="#B8C3D6" stroke-width="3"/><rect x="580" y="517" width="400" height="97" rx="16" fill="#FF8A43"/><text x="598" y="544" font-size="16" fill="#243047">B · RESPUESTA</text><text class="ink" x="598" y="579">Cambio de vista</text><path d="M992 567h33m-10-8 10 8-10 8" fill="none" stroke="#B8C3D6" stroke-width="3"/><rect x="1040" y="517" width="400" height="97" rx="16" fill="#FFF7ED"/><text x="1058" y="544" font-size="16" fill="#243047">C · ESTADO</text><text class="ink" x="1058" y="579">Mapa seleccionado</text><text class="body" x="120" y="651">Último toque gana; conserva búsqueda, cámara y scroll.</text><text x="120" y="687" fill="#FFF7ED" font-size="20">Reducido: cambio inmediato; sin pedir ubicación.</text><path d="M64 706H1536" stroke="#53647E"/><text x="64" y="746" fill="#FF8A43" font-size="25" font-weight="700">03</text><text class="title" x="120" y="746" font-size="27">Marcador + Bottom Sheet</text><text class="body" x="1000" y="746">140 ms marcador · 240 ms hoja</text><rect x="120" y="770" width="400" height="97" rx="16" fill="#FFF7ED"/><text x="138" y="797" font-size="16" fill="#243047">A · INICIO</text><text class="ink" x="138" y="832">Marcador neutro</text><path d="M532 820h33m-10-8 10 8-10 8" fill="none" stroke="#B8C3D6" stroke-width="3"/><rect x="580" y="770" width="400" height="97" rx="16" fill="#FF8A43"/><text x="598" y="797" font-size="16" fill="#243047">B · RESPUESTA</text><text class="ink" x="598" y="832">Un marcador seleccionado</text><path d="M992 820h33m-10-8 10 8-10 8" fill="none" stroke="#B8C3D6" stroke-width="3"/><rect x="1040" y="770" width="400" height="97" rx="16" fill="#FFF7ED"/><text x="1058" y="797" font-size="16" fill="#243047">C · ESTADO</text><text class="ink" x="1058" y="832">Vista previa + Cerrar</text><text class="body" x="120" y="904">Otro marcador reemplaza; volver/cerrar devuelve foco.</text><text x="120" y="940" fill="#FFF7ED" font-size="20">Reducido: aro estático y hoja inmediata.</text><path d="M64 959H1536" stroke="#53647E"/><text x="64" y="999" fill="#FF8A43" font-size="25" font-weight="700">04</text><text class="title" x="120" y="999" font-size="27">Formato 1v1 / 2v2 / 5v5</text><text class="body" x="1000" y="999">140 ms · borde/check</text><rect x="120" y="1023" width="400" height="97" rx="16" fill="#FFF7ED"/><text x="138" y="1050" font-size="16" fill="#243047">A · INICIO</text><text class="ink" x="138" y="1085">1v1 · 2 lugares</text><path d="M532 1073h33m-10-8 10 8-10 8" fill="none" stroke="#B8C3D6" stroke-width="3"/><rect x="580" y="1023" width="400" height="97" rx="16" fill="#FF8A43"/><text x="598" y="1050" font-size="16" fill="#243047">B · RESPUESTA</text><text class="ink" x="598" y="1085">2v2 · seleccionado</text><path d="M992 1073h33m-10-8 10 8-10 8" fill="none" stroke="#B8C3D6" stroke-width="3"/><rect x="1040" y="1023" width="400" height="97" rx="16" fill="#FFF7ED"/><text x="1058" y="1050" font-size="16" fill="#243047">C · ESTADO</text><text class="ink" x="1058" y="1085">2v2 · 4 lugares</text><text class="body" x="120" y="1157">Toques rápidos: último formato. No envía ni navega.</text><text x="120" y="1193" fill="#FFF7ED" font-size="20">Reducido: selección y capacidad instantáneas.</text><path d="M64 1212H1536" stroke="#53647E"/><text x="64" y="1252" fill="#FF8A43" font-size="25" font-weight="700">05</text><text class="title" x="120" y="1252" font-size="27">Pulsar botón</text><text class="body" x="1000" y="1252">100 ms presión · 80 ms retorno</text><rect x="120" y="1276" width="400" height="97" rx="16" fill="#FFF7ED"/><text x="138" y="1303" font-size="16" fill="#243047">A · INICIO</text><text class="ink" x="138" y="1338">Acción disponible</text><path d="M532 1326h33m-10-8 10 8-10 8" fill="none" stroke="#B8C3D6" stroke-width="3"/><rect x="580" y="1276" width="400" height="97" rx="16" fill="#FF8A43"/><text x="598" y="1303" font-size="16" fill="#243047">B · RESPUESTA</text><text class="ink" x="598" y="1338">Presión: escala .98</text><path d="M992 1326h33m-10-8 10 8-10 8" fill="none" stroke="#B8C3D6" stroke-width="3"/><rect x="1040" y="1276" width="400" height="97" rx="16" fill="#FFF7ED"/><text x="1058" y="1303" font-size="16" fill="#243047">C · ESTADO</text><text class="ink" x="1058" y="1338">Acción / ocupado</text><text class="body" x="120" y="1410">Acción inmediata; busy bloquea envíos repetidos.</text><text x="120" y="1446" fill="#FFF7ED" font-size="20">Reducido: tinte, foco y etiqueta; sin escala.</text><path d="M64 1465H1536" stroke="#53647E"/><text x="64" y="1505" fill="#FF8A43" font-size="25" font-weight="700">06</text><text class="title" x="120" y="1505" font-size="27">Confirmar inscripción</text><text class="body" x="1000" y="1505">Red variable · feedback 180 ms</text><rect x="120" y="1529" width="400" height="97" rx="16" fill="#FFF7ED"/><text x="138" y="1556" font-size="16" fill="#243047">A · INICIO</text><text class="ink" x="138" y="1591">Inscribirme</text><path d="M532 1579h33m-10-8 10 8-10 8" fill="none" stroke="#B8C3D6" stroke-width="3"/><rect x="580" y="1529" width="400" height="97" rx="16" fill="#FF8A43"/><text x="598" y="1556" font-size="16" fill="#243047">B · RESPUESTA</text><text class="ink" x="598" y="1591">Comprobando inscripción</text><path d="M992 1579h33m-10-8 10 8-10 8" fill="none" stroke="#B8C3D6" stroke-width="3"/><rect x="1040" y="1529" width="400" height="97" rx="16" fill="#FFF7ED"/><text x="1058" y="1556" font-size="16" fill="#243047">C · ESTADO</text><text class="ink" x="1058" y="1591">Inscripción confirmada</text><text class="body" x="120" y="1663">Error o incertidumbre: recuperar la misma solicitud.</text><text x="120" y="1699" fill="#FFF7ED" font-size="20">Reducido: texto/check estático tras readback.</text><path d="M64 1718H1536" stroke="#53647E"/><text x="64" y="1758" fill="#FF8A43" font-size="25" font-weight="700">07</text><text class="title" x="120" y="1758" font-size="27">Carga / Error / Éxito</text><text class="body" x="1000" y="1758">120 ms aparición · éxito 180 ms</text><rect x="120" y="1782" width="400" height="97" rx="16" fill="#FFF7ED"/><text x="138" y="1809" font-size="16" fill="#243047">A · INICIO</text><text class="ink" x="138" y="1844">Cargando…</text><path d="M532 1832h33m-10-8 10 8-10 8" fill="none" stroke="#B8C3D6" stroke-width="3"/><rect x="580" y="1782" width="400" height="97" rx="16" fill="#FF8A43"/><text x="598" y="1809" font-size="16" fill="#243047">B · RESPUESTA</text><text class="ink" x="598" y="1844">Error · Reintentar</text><path d="M992 1832h33m-10-8 10 8-10 8" fill="none" stroke="#B8C3D6" stroke-width="3"/><rect x="1040" y="1782" width="400" height="97" rx="16" fill="#FFF7ED"/><text x="1058" y="1809" font-size="16" fill="#243047">C · ESTADO</text><text class="ink" x="1058" y="1844">Cambio confirmado</text><text class="body" x="120" y="1916">Son estados alternativos; conserva caché al refrescar.</text><text x="120" y="1952" fill="#FFF7ED" font-size="20">Reducido: estados estáticos; sin shimmer ni shake.</text><path d="M64 1971H1536" stroke="#53647E"/><text class="body" x="64" y="2034">Sin bucles de marcadores, confeti ni solicitudes por fotograma. Arte y movimiento no bloquean acciones.</text><text class="body" x="64" y="2070">Detalle normativo: motion.md · Duraciones sujetas a revisión y pruebas futuras de accesibilidad/rendimiento.</text></svg>